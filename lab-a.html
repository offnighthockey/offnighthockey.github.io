<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Off-Night lab A: Broadcast</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap"><link rel="icon" href="icon.png"><link rel="stylesheet" href="style.css?v=lab">
<style>
.tb { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 26px; padding: 0 6px; border-radius: 7px; vertical-align: middle;
  background: linear-gradient(135deg, var(--c1) 0 68%, var(--c2) 68% 100%); color: var(--fg); font: 700 14px/1 var(--head); letter-spacing: .04em;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), 0 2px 8px rgba(0,0,0,.35); }
.tb.sm { min-width: 34px; height: 22px; font-size: 12px; border-radius: 6px; }
.tb.lg { min-width: 58px; height: 38px; font-size: 19px; border-radius: 10px; }
.tb.xl { min-width: 92px; height: 60px; font-size: 30px; border-radius: 14px; }
.labtabs { position: relative; }
.labtabs button { position: relative; z-index: 1; cursor: pointer; transition: color .2s, transform .15s; }
.labtabs button:active { transform: scale(.96); }
.labtabs .ind { view-transition-name: tabind; pointer-events: none; }
.labtabs:has([data-tab=mine][aria-selected=true]) { --x: 1; } .labtabs:has([data-tab=team][aria-selected=true]) { --x: 2; }
.labswitch { position: fixed; left: 12px; bottom: 12px; z-index: 40; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(4,8,15,.9); border: 1px solid var(--edge); font: 600 13px/1 var(--head); }
.labswitch a { color: var(--steel); text-decoration: none; padding: 6px 10px; border-radius: 999px; }
.labswitch a[aria-current] { background: var(--ice-blue); color: var(--night0); }
.why-line, .note { color: var(--steel); font-size: 14px; }
button[data-night], button[data-team] { cursor: pointer; font: inherit; color: inherit; }
@media (max-width: 860px) { body { padding-bottom: 60px; } .labswitch { bottom: 10px; left: 50%; transform: translateX(-50%); } }

body { background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(40,110,200,.35), transparent 70%), linear-gradient(180deg, #0a1a30, #04080f 60%); }
.bug { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; height: 66px; padding: 0 22px;
  background: linear-gradient(90deg, #0e2747 0%, #081628 55%, #0e2747 100%); border-bottom: 2px solid rgba(79,216,255,.55); box-shadow: 0 6px 30px rgba(0,0,0,.45); }
.bug-logo img { height: 34px; display: block; }
.labtabs.strip { --x: 0; display: grid; grid-template-columns: repeat(3, 150px); width: 450px; justify-self: center; height: 100%; }
.labtabs.strip button { background: none; border: 0; color: var(--steel); font: 700 20px/1 var(--head); letter-spacing: .02em; }
.labtabs.strip button:hover { color: var(--ice); }
.labtabs.strip button[aria-selected=true] { color: var(--amber); text-shadow: 0 0 14px rgba(255,197,61,.45); }
.labtabs.strip .ind { position: absolute; bottom: -2px; left: calc(var(--x) * 150px); width: 150px; height: 4px; background: var(--amber); box-shadow: 0 0 14px rgba(255,197,61,.7); }
.labtabs.strip .ind::after { content: ""; position: absolute; left: 50%; top: -8px; width: 24px; height: 9px; margin-left: -12px; border-radius: 50%; background: #05080d; box-shadow: 0 0 0 1.5px rgba(234,244,251,.5); }
.stage { max-width: 1180px; margin: 0 auto; padding: 22px 18px 40px; }
.a-hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 26px; margin-bottom: 14px; border-radius: 6px 22px 6px 22px;
  background: linear-gradient(100deg, rgba(14,39,71,.95), rgba(8,22,40,.85)); border-left: 6px solid var(--amber); position: relative; overflow: hidden; }
.a-count { display: flex; align-items: center; gap: 16px; }
.a-count .led { font-size: 88px; line-height: .9; }
.a-count span { font: 600 18px/1.25 var(--head); color: var(--ice-dim); }
.a-count b:not(.led) { color: var(--ice); font-size: 26px; }
.k { font: 700 14px/1 var(--head); padding: 6px 10px; border-radius: 4px; font-style: normal; }
.k.light { background: rgba(79,216,255,.15); color: var(--ice-blue); } .k.packed { background: rgba(255,66,80,.15); color: var(--red); }
.a-ticker { display: flex; flex-wrap: wrap; gap: 8px; max-width: 640px; }
.match { display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 8px; background: rgba(4,8,15,.5); }
.match i { font: 600 12px var(--head); color: var(--steel); font-style: normal; }
.a-score { display: flex; align-items: center; gap: 12px; font: 600 16px var(--head); color: var(--ice-dim); }
.a-score .led { font-size: 40px; } .a-score i { font-style: normal; color: var(--steel); }
.a-nights { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 0 0 18px; }
.a-nights button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; background: #071322; border: 1px solid var(--line); border-radius: 4px; color: var(--steel); }
.a-nights button .led { font-size: 26px; color: var(--ice); }
.a-nights button.light .led { color: var(--ice-blue); } .a-nights button.packed .led { color: var(--red); }
.a-nights button[aria-pressed=true] { border-color: var(--amber); box-shadow: inset 0 -3px 0 var(--amber); }
.a-lower h2 { font-size: 20px; margin: 18px 0 8px; color: var(--ice); }
.a-lower h2 small, .a-lineup h2 small { font: 500 13px var(--body); color: var(--steel); margin-left: 8px; }
.lt { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 14px; padding: 10px 16px; margin: 0 0 6px;
  background: linear-gradient(90deg, rgba(14,39,71,.92), rgba(8,22,40,.6)); clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); border-left: 4px solid var(--ice-blue); }
.lt-n b { display: block; font: 700 19px/1.15 var(--head); color: var(--ice); }
.lt-n span { font-size: 13px; color: var(--steel); }
.lt > .led { font-size: 24px; min-width: 62px; text-align: right; }
.a-alert { border-left: 4px solid var(--amber); background: rgba(255,197,61,.08); padding: 10px 14px; }
.a-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; padding: 16px; margin: 0 0 10px; background: rgba(8,22,40,.85); border: 1px solid var(--line); border-radius: 4px 18px 4px 18px; }
.a-pair .side { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; }
.a-pair .side em { grid-column: 1 / -1; font: 700 13px var(--head); font-style: normal; letter-spacing: .06em; }
.a-pair .add em { color: var(--green); } .a-pair .drop em { color: var(--red); }
.a-pair .side b { font: 700 19px var(--head); } .a-pair .side .spark, .a-pair .side .pill { grid-column: 2; }
.a-pair .delta { text-align: center; } .a-pair .delta .led { font-size: 44px; color: var(--green); text-shadow: 0 0 14px rgba(61,220,132,.5); }
.a-pair .delta span { display: block; font-size: 12px; color: var(--steel); }
.a-pair .why-line { grid-column: 1 / -1; margin: 0; }
.a-teambar { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; margin-bottom: 8px; }
.a-teambar button { background: none; border: 0; padding: 3px; border-radius: 9px; opacity: .65; }
.a-teambar button[aria-pressed=true] { opacity: 1; box-shadow: 0 0 0 2px var(--amber); }
.a-lineup h2 { font-size: 22px; margin: 6px 0 12px; }
.line { display: grid; grid-template-columns: 44px repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.line.d { grid-template-columns: 44px repeat(2, 1fr) 1fr; } .line.g { grid-template-columns: 44px repeat(3, 1fr); }
.line em { font: 700 18px var(--head); color: var(--amber); font-style: normal; align-self: center; }
.card { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 10px 14px; background: linear-gradient(160deg, #10284a, #081628); border: 1px solid rgba(79,216,255,.22); border-radius: 10px; }
.card .led { grid-row: 1 / 3; font-size: 34px; color: var(--ice); text-shadow: 0 0 12px rgba(79,216,255,.45); min-width: 44px; }
.card span { font: 700 17px/1.1 var(--head); } .card small { color: var(--steel); font-size: 12.5px; }
.a-lower.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 860px) {
  .bug { grid-template-columns: auto 1fr; height: auto; padding: 8px 12px; row-gap: 6px; } .bug .labtabs { grid-column: 1 / -1; order: 3; height: 44px; grid-template-columns: repeat(3, 1fr); width: 100%; }
  .labtabs.strip .ind { left: calc(var(--x) * 100% / 3); width: calc(100% / 3); }
  .a-count .led { font-size: 64px; } .a-pair { grid-template-columns: 1fr; } .line, .line.d, .line.g { grid-template-columns: 1fr; } .line em { margin-top: 6px; } .a-lower.two { grid-template-columns: 1fr; }
  .lt { grid-template-columns: auto 1fr auto; } .lt .spark { display: none; }
}
</style><script src="app.js?v=lab" defer></script><script src="lab.js?v=lab" defer></script></head>
