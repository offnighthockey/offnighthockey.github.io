<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Off-Night lab: Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Big+Shoulders+Text:wght@500;600;700&display=swap"><link rel="icon" href="icon.png"><link rel="stylesheet" href="style-lab.css?v=lab2">
<style>
.tb { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 26px; padding: 0 6px; border-radius: 6px; vertical-align: middle;
  background: linear-gradient(135deg, var(--c1) 0 68%, var(--c2) 68% 100%); color: var(--fg); font-weight: 800; font-size: 13px; letter-spacing: .04em; }
.tb.sm { min-width: 34px; height: 21px; font-size: 11.5px; } .tb.lg { min-width: 60px; height: 40px; font-size: 18px; border-radius: 9px; } .tb.xl { min-width: 96px; height: 64px; font-size: 30px; border-radius: 14px; }
.labswitch { position: fixed; right: 14px; bottom: 14px; z-index: 60; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.75); backdrop-filter: blur(8px); font: 600 13px/1 system-ui, sans-serif; }
.labswitch a { color: #aab; text-decoration: none; padding: 7px 11px; border-radius: 999px; } .labswitch a[aria-current] { background: #fff; color: #000; }
button { font: inherit; color: inherit; cursor: pointer; }
.scoring select { width: auto; }

:root { --ink: #f4f7fb; --dim: #8e98a8; --red: #ff3b3b; --amber: #ffb400; --cold: #bfe3ff; }
body { margin: 0; color: var(--ink); font-family: "Big Shoulders Text", system-ui, sans-serif; font-size: 17px; overflow: hidden; height: 100vh; height: 100dvh;
  background: radial-gradient(ellipse 30% 55% at 20% -5%, rgba(220,235,255,.16), transparent 70%), radial-gradient(ellipse 30% 55% at 50% -8%, rgba(220,235,255,.20), transparent 70%),
    radial-gradient(ellipse 30% 55% at 80% -5%, rgba(220,235,255,.16), transparent 70%), radial-gradient(circle at 50% 120%, rgba(255,59,59,.12), transparent 55%), #050608; }
body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 26vh; pointer-events: none; opacity: .35;
  background: radial-gradient(circle, rgba(255,255,255,.22) 1px, transparent 1.6px) 0 0 / 9px 9px; -webkit-mask: linear-gradient(transparent, #000); mask: linear-gradient(transparent, #000); }
.ar-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 0; } .ar-top img { height: 30px; display: block; }
.ar-top .scoring { color: var(--dim); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.ar-top select { background: #11141a; color: var(--ink); border: 1px solid #2a2f38; border-radius: 8px; padding: 6px 10px; font: inherit; }
.ar-words { position: relative; display: flex; gap: clamp(18px, 4vw, 56px); padding: 6px 28px 22px; overflow-x: auto; scrollbar-width: none; }
.ar-words button { background: none; border: 0; padding: 0; font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: clamp(42px, 8vw, 104px); line-height: .95;
  text-transform: uppercase; letter-spacing: -.01em; white-space: nowrap; transition: opacity .15s, text-shadow .3s; }
.ar-words button[aria-selected=true] { text-shadow: 0 0 40px rgba(191,227,255,.35); }
.ar-words button:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; }
.ar-puck { position: absolute; left: 0; bottom: 6px; width: 28px; height: 12px; border-radius: 50%; background: #000; box-shadow: 0 0 0 2px rgba(244,247,251,.7), 0 0 24px rgba(191,227,255,.6); }
.ar-track { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; height: calc(100vh - 190px); scrollbar-width: none; overscroll-behavior-x: contain; }
.ar-track::-webkit-scrollbar, .ar-words::-webkit-scrollbar { display: none; }
.ar-slide { flex: 0 0 100%; scroll-snap-align: start; overflow-y: auto; padding: 4px 28px 90px; box-sizing: border-box; }
.ar-slide > * { max-width: 1180px; }
.ar-nights { display: flex; gap: 6px; margin-bottom: 18px; } .ar-nights button { background: none; border: 1px solid #252a33; border-radius: 10px; padding: 6px 12px; display: grid; justify-items: center; min-width: 58px; color: var(--dim); }
.ar-nights b { font: 900 26px "Big Shoulders Display"; color: var(--ink); } .ar-nights .light b { color: var(--cold); } .ar-nights .packed b { color: var(--red); }
.ar-nights button[aria-pressed=true] { border-color: var(--ink); background: rgba(255,255,255,.06); }
.ar-h { font: 800 clamp(26px, 3.4vw, 40px) "Big Shoulders Display"; margin: 0 0 14px; } .ar-h em { font-style: normal; margin-left: 14px; color: var(--dim); font-size: .62em; }
.ar-h em.light { color: var(--cold); } .ar-h em.packed { color: var(--red); }
.ar-h3 { font: 800 22px "Big Shoulders Display"; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 26px 0 10px; }
.spot { position: relative; background: radial-gradient(240px circle at var(--mx, -999px) var(--my, -999px), rgba(191,227,255,.13), transparent 70%), #0d1015; border: 1px solid #1f242c; border-radius: 14px; transition: transform .2s, border-color .2s; }
.spot:hover { transform: translateY(-2px); border-color: #3a4250; }
.ar-faceoffs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.ar-fo { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; } .ar-fo span { color: var(--dim); font-size: 14px; }
.ar-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.ar-card { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; gap: 6px 12px; align-items: center; padding: 16px 18px; }
.ar-card b { font: 800 22px/1.05 "Big Shoulders Display"; } .ar-card small { grid-column: 1 / 3; color: var(--dim); font-size: 14px; }
.ar-card .spark { grid-column: 3; grid-row: 1; } .ar-card strong { grid-column: 3; grid-row: 2; font: 900 30px/1 "Big Shoulders Display"; color: var(--amber); text-align: right; }
.ar-card strong i, .ar-swap strong i { display: block; font: 500 12px "Big Shoulders Text"; color: var(--dim); font-style: normal; }
.ar-score { display: flex; align-items: baseline; gap: 14px; margin: 4px 0 8px; color: var(--dim); } .ar-score b { font: 900 64px/1 "Big Shoulders Display"; color: var(--ink); } .ar-score i { font-style: normal; }
.ar-big { font: 700 24px "Big Shoulders Display"; margin: 0 0 12px; } .ar-big b { color: var(--amber); font-size: 1.4em; }
.ar-alert { border-left: 4px solid var(--amber); padding: 10px 14px; background: rgba(255,180,0,.08); border-radius: 0 10px 10px 0; }
.ar-swap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 18px 20px; margin-bottom: 12px; }
.ar-swap > div { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; } .ar-swap em { grid-column: 1 / -1; font: 900 14px "Big Shoulders Display"; letter-spacing: .1em; color: #3ddc84; font-style: normal; }
.ar-swap em.red { color: var(--red); } .ar-swap b { font: 800 24px "Big Shoulders Display"; } .ar-swap .spark, .ar-swap .pill { grid-column: 2; }
.ar-swap strong { font: 900 54px/1 "Big Shoulders Display"; color: #3ddc84; text-align: center; } .ar-swap p { grid-column: 1 / -1; margin: 0; color: var(--dim); font-size: 15px; }
.ar-rack { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 14px; } .ar-rack button { background: none; border: 0; padding: 3px; border-radius: 9px; opacity: .55; transition: opacity .15s, transform .15s; }
.ar-rack button:hover { opacity: 1; transform: translateY(-2px); } .ar-rack button[aria-pressed=true] { opacity: 1; box-shadow: 0 0 0 2px var(--ink); }
.ar-teamhead { display: flex; align-items: center; gap: 18px; margin: 6px 0 6px; } .ar-teamhead h2 { font: 900 clamp(34px, 5vw, 60px)/1 "Big Shoulders Display"; margin: 0; text-transform: uppercase; } .ar-teamhead p { margin: 4px 0 0; color: var(--dim); }
.ar-note { color: var(--dim); font-size: 14px; margin: 4px 0 14px; }
.ar-line { display: grid; grid-template-columns: 70px repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; } .ar-line.d { grid-template-columns: 70px repeat(2, minmax(0, 1fr)); max-width: 820px; }
.ar-line > span { align-self: center; font: 800 16px "Big Shoulders Display"; color: var(--dim); text-transform: uppercase; }
.ar-jersey { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; padding: 12px 14px; }
.ar-jersey b { grid-row: 1 / 3; font: 900 44px/1 "Big Shoulders Display"; color: transparent; -webkit-text-stroke: 1.5px var(--ink); min-width: 52px; }
.ar-jersey span { font: 800 20px/1.1 "Big Shoulders Display"; align-self: end; } .ar-jersey small { color: var(--dim); font-size: 13.5px; }
.ar-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; } .ar-row { margin: 0 0 6px; font-size: 17px; } .ar-row small { color: var(--dim); margin-left: 8px; }
.ar-quiet { color: var(--dim); }
@media (max-width: 760px) { .ar-words button { font-size: clamp(28px, 9.4vw, 104px); } .ar-words { gap: 14px; } .ar-nights { overflow-x: auto; } .ar-nights button { min-width: 44px; padding: 6px; } .ar-faceoffs { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } .ar-top { padding: 10px 16px 0; } .ar-words { padding: 4px 16px 14px; } .ar-track { height: calc(100dvh - 150px); } .ar-slide { padding: 4px 16px 90px; }
  .ar-line, .ar-line.d { grid-template-columns: 1fr; } .ar-swap { grid-template-columns: 1fr; } .ar-cols { grid-template-columns: 1fr; } .ar-top .scoring span { display: none; } }
</style><script src="app-lab.js?v=lab2" defer></script><script src="lab.js?v=lab2" defer></script></head>
