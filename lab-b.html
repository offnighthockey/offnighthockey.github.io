<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Off-Night lab B: Rink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap"><link rel="icon" href="icon.png"><link rel="stylesheet" href="style.css?v=lab">
<style>
.tb { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 26px; padding: 0 6px; border-radius: 7px; vertical-align: middle;
  background: linear-gradient(135deg, var(--c1) 0 68%, var(--c2) 68% 100%); color: var(--fg); font: 700 14px/1 var(--head); letter-spacing: .04em;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), 0 2px 8px rgba(0,0,0,.35); }
.tb.sm { min-width: 34px; height: 22px; font-size: 12px; border-radius: 6px; }
.tb.lg { min-width: 58px; height: 38px; font-size: 19px; border-radius: 10px; }
.tb.xl { min-width: 92px; height: 60px; font-size: 30px; border-radius: 14px; }
.labtabs { position: relative; }
.labtabs button { position: relative; z-index: 1; cursor: pointer; transition: color .2s, transform .15s; }
.labtabs button:active { transform: scale(.96); }
.labtabs .ind { view-transition-name: tabind; pointer-events: none; }
.labtabs:has([data-tab=mine][aria-selected=true]) { --x: 1; } .labtabs:has([data-tab=team][aria-selected=true]) { --x: 2; }
.labswitch { position: fixed; left: 12px; bottom: 12px; z-index: 40; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(4,8,15,.9); border: 1px solid var(--edge); font: 600 13px/1 var(--head); }
.labswitch a { color: var(--steel); text-decoration: none; padding: 6px 10px; border-radius: 999px; }
.labswitch a[aria-current] { background: var(--ice-blue); color: var(--night0); }
.why-line, .note { color: var(--steel); font-size: 14px; }
button[data-night], button[data-team] { cursor: pointer; font: inherit; color: inherit; }
@media (max-width: 860px) { body { padding-bottom: 60px; } .labswitch { bottom: 10px; left: 50%; transform: translateX(-50%); } }

body { background:
  radial-gradient(circle at 50% 46%, transparent 0 118px, rgba(79,216,255,.14) 119px 121px, transparent 122px),
  linear-gradient(90deg, transparent calc(50% - 3px), rgba(255,66,80,.22) calc(50% - 3px) calc(50% + 3px), transparent calc(50% + 3px)),
  linear-gradient(90deg, transparent 22%, rgba(60,120,230,.16) 22% calc(22% + 10px), transparent calc(22% + 10px) calc(78% - 10px), rgba(60,120,230,.16) calc(78% - 10px) 78%, transparent 78%),
  linear-gradient(180deg, #0c1d33, #050a12); background-attachment: fixed; }
.b-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; } .b-top img { height: 36px; display: block; }
.labtabs.dots { --x: 0; display: grid; grid-template-columns: repeat(3, 96px); width: max-content; gap: 18px; margin: 4px auto 18px; }
.labtabs.dots button { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; color: var(--steel); font: 700 16px var(--head); }
.labtabs.dots button::before { content: ""; width: 52px; height: 52px; border-radius: 50%; border: 3px solid rgba(255,66,80,.5);
  background: radial-gradient(circle, rgba(255,66,80,.9) 0 7px, transparent 8px); transition: box-shadow .2s, border-color .2s; }
.labtabs.dots button:hover::before { border-color: var(--red); }
.labtabs.dots button[aria-selected=true] { color: var(--ice); } .labtabs.dots button[aria-selected=true]::before { border-color: var(--red); box-shadow: 0 0 22px rgba(255,66,80,.55); }
.labtabs.dots .ind { position: absolute; top: 19px; left: calc(var(--x) * (96px + 18px) + 36px); width: 24px; height: 14px; border-radius: 50%; background: #05080d; box-shadow: 0 0 0 1.5px rgba(234,244,251,.6), 0 4px 10px rgba(0,0,0,.6); }
.b-ice { max-width: 1120px; margin: 0 auto; padding: 0 18px 40px; }
.b-board { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.b-board button { width: 92px; padding: 10px 0; border-radius: 999px; background: rgba(5,10,18,.75); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; color: var(--steel); }
.b-board button .led { font-size: 26px; color: var(--ice); } .b-board button.light { border-color: rgba(79,216,255,.6); } .b-board button.light .led { color: var(--ice-blue); }
.b-board button.packed .led { color: var(--red); } .b-board button[aria-pressed=true] { border-color: var(--amber); box-shadow: 0 0 18px rgba(255,197,61,.35); }
.b-center { text-align: center; padding: 18px; position: relative; overflow: hidden; }
.b-center h1 { font-size: clamp(30px, 5vw, 52px); margin: 0 0 14px; } .b-center .sub { margin: 0 auto 10px; }
.b-faceoffs { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.fo { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(5,10,18,.7); border: 1px solid var(--line); }
.fo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px rgba(255,66,80,.8); }
.b-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 12px; }
.puck-card { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto auto; gap: 4px 10px; align-items: center; padding: 14px 16px; border-radius: 20px;
  background: radial-gradient(ellipse at 20% 0%, rgba(79,216,255,.12), transparent 60%), #08111d; border: 1px solid rgba(234,244,251,.14); box-shadow: 0 10px 24px rgba(0,0,0,.45); }
.puck-card b:not(.led) { font: 700 18px var(--head); } .puck-card span { grid-column: 1 / -1; font-size: 13px; color: var(--steel); }
.puck-card .spark { grid-column: 1 / 3; } .puck-card > .led { grid-row: 1; grid-column: 3; font-size: 26px; }
.puck-card.out { border-color: rgba(255,66,80,.4); } .puck-card.sys { border-style: dashed; }
.b-changes { display: grid; gap: 12px; }
.change { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 12px; align-items: center; padding: 16px; border-radius: 18px; background: rgba(5,10,18,.8); border: 1px solid var(--line); }
.change .bench, .change .onice { display: flex; align-items: center; gap: 10px; } .change b { font: 700 18px var(--head); }
.change .bench span { color: var(--red); font: 700 13px var(--head); } .change .onice span { color: var(--green); font: 700 13px var(--head); }
.change .arrow { width: 110px; height: 30px; fill: none; stroke: var(--ice-blue); stroke-width: 3; }
.change .gain { font-size: 34px; color: var(--green); } .change p { grid-column: 1 / -1; margin: 0; color: var(--steel); font-size: 14px; }
.b-teams { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px; }
.b-teams button { background: none; border: 0; padding: 2px; border-radius: 8px; opacity: .6; } .b-teams button[aria-pressed=true] { opacity: 1; box-shadow: 0 0 0 2px var(--amber); }
.b-rink { position: relative; overflow: hidden; } .b-rink h1 { display: flex; align-items: center; gap: 12px; font-size: 32px; } .b-rink h1 small { font: 500 15px var(--body); color: var(--steel); }
.half { position: relative; border: 3px solid rgba(234,244,251,.35); border-radius: 0 0 160px 160px / 0 0 120px 120px; padding: 18px 18px 26px; background: rgba(220,235,250,.04); }
.half .row { display: grid; grid-template-columns: 24px repeat(3, 1fr); gap: 8px; margin-bottom: 8px; } .def .row { grid-template-columns: 24px repeat(2, 1fr); max-width: 66%; margin-left: auto; margin-right: auto; }
.half em { font: 700 15px var(--head); color: var(--steel); font-style: normal; align-self: center; }
.pl { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 999px; background: rgba(5,10,18,.85); border: 1px solid rgba(234,244,251,.18); font: 600 15px var(--head); }
.pl .led { font-size: 18px; min-width: 24px; }
.blue { height: 8px; margin: 10px -18px 12px; background: rgba(60,120,230,.55); }
.crease { display: flex; justify-content: center; gap: 10px; margin-top: 14px; padding-top: 18px; border-top: 2px solid rgba(255,66,80,.45); border-radius: 50% 50% 0 0 / 30px 30px 0 0; background: rgba(79,216,255,.08); }
.pl.backup { opacity: .7; }
@media (max-width: 760px) { .labtabs.dots { grid-template-columns: repeat(3, 84px); gap: 10px; } .labtabs.dots .ind { left: calc(var(--x) * (84px + 10px) + 30px); }
  .half .row, .def .row { grid-template-columns: 1fr; max-width: none; } .change { grid-template-columns: 1fr; } .change .arrow { transform: rotate(90deg); justify-self: center; } }
</style><script src="app.js?v=lab" defer></script><script src="lab.js?v=lab" defer></script></head>
